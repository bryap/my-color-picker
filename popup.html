<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="header">
    <h1>My Color Picker</h1>
    <button id="eyedropper-trigger" title="Select color from webpage">
      <i class="fa-solid fa-eye-dropper"></i>
    </button>
  </div>

  <div class="row">
    <div id="hex-display">#Hex code</div>
    <button class="copy-btn" id="copy-hex" title="Copy Hex">
      <i class="fa-regular fa-copy"></i>
    </button>
  </div>

  <div class="row">
    <div class="rgb-group">
      <div class="rgb-box"><span id="r-val">0</span><label>R</label></div>
      <div class="rgb-box"><span id="g-val">0</span><label>G</label></div>
      <div class="rgb-box"><span id="b-val">0</span><label>B</label></div>
    </div>
    <button class="copy-btn" id="copy-rgb" title="Copy RGB">
      <i class="fa-regular fa-copy"></i>
    </button>
  </div>

  <div id="storage-slots">
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
  </div>

  <div class="footer">Created by Brya K. Patterson, 2026</div>

  <script src="popup.js"></script>
</body>
</html>
